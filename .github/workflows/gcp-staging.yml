name: Deploy GCP staging
# Manual only. The deploy job needs the protected gcp-staging environment.
# The service stays private: --no-allow-unauthenticated on every deploy.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA to build and deploy
        required: true
        type: string
      input_interpreter:
        description: Search interpreter (span-v2 needs the TypeSafe key; rules needs no provider)
        required: true
        type: choice
        default: span-v2
        options:
          - rules
          - jev-v1
          - span-v2
permissions:
  contents: read
concurrency:
  group: gcp-staging-deploy
  cancel-in-progress: false
jobs:
  prepare:
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Verify exact revision
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Require green CI on the exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" --jq '.check_runs[]' | jq -s '{check_runs: .}' > exact-sha-checks.json
          node -e "const fs=require('node:fs');const runs=JSON.parse(fs.readFileSync('exact-sha-checks.json')).check_runs??[];for(const name of ['verify (ubuntu-latest)','collector (ubuntu-latest)','terraform','container']){const latest=runs.filter(x=>x.name===name&&x.app?.slug==='github-actions').sort((a,b)=>(Date.parse(b.started_at)||0)-(Date.parse(a.started_at)||0))[0];if(latest?.status!=='completed'||latest?.conclusion!=='success')throw new Error('Missing successful exact-SHA check: '+name)}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            collector/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix ../collector
      - name: Run offline release checks
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm test --prefix ../collector
          npm run eval:agent
      - name: Build and smoke Node server
        run: |
          npm run build:node
          npm run test:smoke:node
      - name: Build immutable Linux image
        env:
          LOCAL_IMAGE: biplan-gcp-candidate:${{ inputs.expected_sha }}
        run: docker build --pull --platform linux/amd64 -f Dockerfile --tag "$LOCAL_IMAGE" ..
      - name: Smoke the image without credentials
        env:
          LOCAL_IMAGE: biplan-gcp-candidate:${{ inputs.expected_sha }}
        run: bash scripts/smoke-container.sh "$LOCAL_IMAGE"
      - name: Package image and provenance
        env:
          LOCAL_IMAGE: biplan-gcp-candidate:${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          rm -rf gcp-candidate
          mkdir gcp-candidate
          docker save "$LOCAL_IMAGE" | gzip -n > gcp-candidate/image.tar.gz
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          WEB_LOCK="$(sha256sum package-lock.json | cut -d' ' -f1)"
          IMAGE_ID="$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')"
          SOURCE_TREE="$SOURCE_TREE" WEB_LOCK="$WEB_LOCK" IMAGE_ID="$IMAGE_ID" node -e "const fs=require('node:fs');const p={schemaVersion:1,revision:process.env.EXPECTED_SHA,sourceTree:process.env.SOURCE_TREE,imageId:process.env.IMAGE_ID,platform:'linux/amd64',node:process.version,lockfiles:{web:process.env.WEB_LOCK},workflowRunId:process.env.GITHUB_RUN_ID,workflowRunAttempt:process.env.GITHUB_RUN_ATTEMPT};fs.writeFileSync('gcp-candidate/provenance.json',JSON.stringify(p,null,2)+'\n')"
          (cd gcp-candidate && sha256sum image.tar.gz > image.sha256 && sha256sum image.sha256 provenance.json > manifest.sha256)
      - name: Upload immutable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcp-staging-image-${{ inputs.expected_sha }}
          path: web/gcp-candidate
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  deploy:
    needs: prepare
    if: needs.prepare.result == 'success'
    permissions:
      contents: read
      id-token: write
    environment: gcp-staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      INPUT_INTERPRETER: ${{ inputs.input_interpreter || 'span-v2' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_COLLECTION_BUCKET: ${{ vars.GCP_COLLECTION_BUCKET }}
      GCP_FIRESTORE_DATABASE: ${{ vars.GCP_FIRESTORE_DATABASE || '(default)' }}
      # Required secrets (name + pinned numeric version).
      GCP_SYNC_TOKEN_SECRET: ${{ vars.GCP_SYNC_TOKEN_SECRET }}
      GCP_SYNC_TOKEN_SECRET_VERSION: ${{ vars.GCP_SYNC_TOKEN_SECRET_VERSION }}
      GCP_TYPESAFE_API_KEY_SECRET: ${{ vars.GCP_TYPESAFE_API_KEY_SECRET }}
      GCP_TYPESAFE_API_KEY_SECRET_VERSION: ${{ vars.GCP_TYPESAFE_API_KEY_SECRET_VERSION }}
      GCP_VOYAGE_API_KEY_SECRET: ${{ vars.GCP_VOYAGE_API_KEY_SECRET }}
      GCP_VOYAGE_API_KEY_SECRET_VERSION: ${{ vars.GCP_VOYAGE_API_KEY_SECRET_VERSION }}
      # Optional agent settings. Each feature stays off without its setting.
      GCP_AGENT_VERTEX_AI: ${{ vars.GCP_AGENT_VERTEX_AI || 'false' }}
      GCP_AGENT_MODEL: ${{ vars.GCP_AGENT_MODEL }}
      GCP_GEMINI_API_KEY_SECRET: ${{ vars.GCP_GEMINI_API_KEY_SECRET }}
      GCP_GEMINI_API_KEY_SECRET_VERSION: ${{ vars.GCP_GEMINI_API_KEY_SECRET_VERSION }}
      GCP_GOOGLE_MAPS_API_KEY_SECRET: ${{ vars.GCP_GOOGLE_MAPS_API_KEY_SECRET }}
      GCP_GOOGLE_MAPS_API_KEY_SECRET_VERSION: ${{ vars.GCP_GOOGLE_MAPS_API_KEY_SECRET_VERSION }}
      # Firebase web settings are public identifiers, not secrets.
      FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Validate protected staging configuration and build settings
        id: settings
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$INPUT_INTERPRETER" == 'rules' || "$INPUT_INTERPRETER" == 'jev-v1' || "$INPUT_INTERPRETER" == 'span-v2' ]]
          [[ "$GCP_REGION" =~ ^[a-z]+-[a-z]+[0-9]+$ ]]
          [[ "$GCP_CLOUD_RUN_SERVICE" =~ ^[a-z][a-z0-9-]{1,61}[a-z0-9]$ && "$GCP_CLOUD_RUN_SERVICE" == *staging* ]]
          [[ "$GCP_ARTIFACT_REGISTRY_REPOSITORY" =~ ^[a-z][a-z0-9._-]{1,61}[a-z0-9]$ ]]
          [[ "$GCP_COLLECTION_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$ && "$GCP_COLLECTION_BUCKET" == *staging* ]]
          [[ "$GCP_FIRESTORE_DATABASE" == '(default)' || "$GCP_FIRESTORE_DATABASE" =~ ^[a-z][a-z0-9-]{2,61}[a-z0-9]$ ]]
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[A-Za-z0-9_-]+/providers/[A-Za-z0-9_-]+$ ]]
          [[ "$GCP_DEPLOY_SERVICE_ACCOUNT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\.iam\.gserviceaccount\.com$ ]]
          [[ "$GCP_RUNTIME_SERVICE_ACCOUNT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\.iam\.gserviceaccount\.com$ ]]
          secret() { # NAME_VAR VERSION_VAR ENV_NAME required|optional
            local name="${!1:-}" version="${!2:-}"
            if [[ -z "$name" && -z "$version" && "$4" == optional ]]; then return 0; fi
            [[ "$name" =~ ^[A-Za-z][A-Za-z0-9_-]{0,254}$ && "$version" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid secret setting for $3" >&2; exit 1; }
            SECRETS+=("$3=$name:$version")
          }
          SECRETS=()
          secret GCP_SYNC_TOKEN_SECRET GCP_SYNC_TOKEN_SECRET_VERSION SYNC_TOKEN required
          secret GCP_TYPESAFE_API_KEY_SECRET GCP_TYPESAFE_API_KEY_SECRET_VERSION TYPESAFE_API_KEY required
          secret GCP_VOYAGE_API_KEY_SECRET GCP_VOYAGE_API_KEY_SECRET_VERSION VOYAGE_API_KEY required
          secret GCP_GEMINI_API_KEY_SECRET GCP_GEMINI_API_KEY_SECRET_VERSION GEMINI_API_KEY optional
          secret GCP_GOOGLE_MAPS_API_KEY_SECRET GCP_GOOGLE_MAPS_API_KEY_SECRET_VERSION GOOGLE_MAPS_API_KEY optional
          ENV_VARS=(
            BIPLAN_RUNTIME=node "BIPLAN_GCP_PROJECT=$GCP_PROJECT_ID" "GCP_STORAGE_BUCKET=$GCP_COLLECTION_BUCKET"
            "FIRESTORE_DATABASE=$GCP_FIRESTORE_DATABASE" DEPLOYMENT_ENV=staging "DEPLOYMENT_SHA=$EXPECTED_SHA"
            BIPLAN_CLIENT_IP_MODE=shared BIPLAN_PREVIEW_TESTING=false AI_DAILY_LIMIT=100 VOYAGE_DIMENSIONS=1024
            "INPUT_INTERPRETER=$INPUT_INTERPRETER"
          )
          [[ "$GCP_AGENT_VERTEX_AI" == 'true' || "$GCP_AGENT_VERTEX_AI" == 'false' ]]
          if [[ "$GCP_AGENT_VERTEX_AI" == 'true' ]]; then
            ENV_VARS+=(GOOGLE_GENAI_USE_VERTEXAI=true "GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID" "GOOGLE_CLOUD_LOCATION=$GCP_REGION")
          fi
          if [[ -n "${GCP_AGENT_MODEL:-}" ]]; then
            [[ "$GCP_AGENT_MODEL" =~ ^[a-z0-9][a-z0-9.-]{1,80}$ ]]
            ENV_VARS+=("BIPLAN_AGENT_MODEL=$GCP_AGENT_MODEL")
          fi
          if [[ -n "${FIREBASE_PROJECT_ID:-}${FIREBASE_WEB_API_KEY:-}${FIREBASE_AUTH_DOMAIN:-}" ]]; then
            [[ "$FIREBASE_WEB_API_KEY" =~ ^[A-Za-z0-9_-]{20,80}$ ]]
            [[ "$FIREBASE_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
            [[ "$FIREBASE_AUTH_DOMAIN" =~ ^[a-z0-9.-]{4,253}$ ]]
            ENV_VARS+=("FIREBASE_WEB_API_KEY=$FIREBASE_WEB_API_KEY" "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" "FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN")
          fi
          { echo "env_vars=$(IFS=,; echo "${ENV_VARS[*]}")"; echo "secrets=$(IFS=,; echo "${SECRETS[*]}")"; } >> "$GITHUB_OUTPUT"
      - name: Download reviewed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gcp-staging-image-${{ inputs.expected_sha }}
          path: candidate
      - name: Verify and load reviewed candidate
        run: |
          set -euo pipefail
          cd candidate
          sha256sum --check manifest.sha256
          sha256sum --check image.sha256
          node -e "const p=require('./provenance.json');if(p.revision!==process.env.EXPECTED_SHA||p.platform!=='linux/amd64')process.exit(1)"
          gunzip --stdout image.tar.gz | docker load
      - id: auth
        name: Authenticate deploy identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Push reviewed image and resolve digest
        id: image
        run: |
          set -euo pipefail
          LOCAL_IMAGE="biplan-gcp-candidate:$EXPECTED_SHA"
          REMOTE_TAG="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REGISTRY_REPOSITORY/$GCP_CLOUD_RUN_SERVICE:$EXPECTED_SHA"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker tag "$LOCAL_IMAGE" "$REMOTE_TAG"
          docker push "$REMOTE_TAG"
          IMAGE_REF="$(docker inspect --format='{{index .RepoDigests 0}}' "$REMOTE_TAG")"
          [[ "$IMAGE_REF" =~ @sha256:[0-9a-f]{64}$ ]]
          echo "ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
      - name: Deploy private staging revision without traffic
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          ENV_VARS: ${{ steps.settings.outputs.env_vars }}
          SECRETS: ${{ steps.settings.outputs.secrets }}
        run: |
          set -euo pipefail
          gcloud run deploy "$GCP_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE_REF" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" --no-allow-unauthenticated \
            --min-instances 0 --max-instances 1 --concurrency 32 --cpu 1 --cpu-throttling --no-cpu-boost --memory 2Gi --timeout 300 \
            --set-env-vars "$ENV_VARS" --set-secrets "$SECRETS" --no-traffic --quiet
      - id: revision
        name: Verify the new revision
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --platform managed --format=json > service.json
          CANDIDATE_REVISION="$(node -e "const s=require('./service.json');const n=s.status?.latestCreatedRevisionName;if(typeof n!=='string'||!n.startsWith(process.env.GCP_CLOUD_RUN_SERVICE+'-')||!/^[a-z][a-z0-9-]{0,62}$/.test(n))process.exit(1);process.stdout.write(n)")"
          gcloud run revisions describe "$CANDIDATE_REVISION" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --platform managed --format=json > revision.json
          CANDIDATE_REVISION="$CANDIDATE_REVISION" node -e "
            const r=require('./revision.json');const c=r.spec?.containers?.[0];
            if(r.metadata?.name!==process.env.CANDIDATE_REVISION||r.status?.conditions?.find(x=>x.type==='Ready')?.status!=='True')throw new Error('Revision is not ready.');
            if(!c||c.image!==process.env.IMAGE_REF)throw new Error('Revision image does not match the reviewed digest.');
            const v=Object.fromEntries((c.env??[]).filter(x=>typeof x?.value==='string').map(x=>[x.name,x.value]));
            for(const [k,e] of [['BIPLAN_RUNTIME','node'],['DEPLOYMENT_ENV','staging'],['DEPLOYMENT_SHA',process.env.EXPECTED_SHA]])if(v[k]!==e)throw new Error('Revision has invalid '+k+'.');"
          echo "name=$CANDIDATE_REVISION" >> "$GITHUB_OUTPUT"
      - name: Send all traffic to the verified revision
        env:
          CANDIDATE_REVISION: ${{ steps.revision.outputs.name }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$GCP_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --platform managed --to-revisions "$CANDIDATE_REVISION=100" --quiet
      - id: service
        name: Resolve private service URL
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          [[ "$SERVICE_URL" =~ ^https://[a-z0-9-]+-[a-z0-9-]+\.[a-z0-9-]+\.run\.app$ ]]
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
      - id: health_auth
        name: Mint service-account identity token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true
      - name: Verify private staging health
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
          ID_TOKEN: ${{ steps.health_auth.outputs.id_token }}
        run: |
          set -euo pipefail
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "$SERVICE_URL/api/health")" = 403
          test "$(curl --silent --show-error --max-time 30 --output health.json --write-out '%{http_code}' --header "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/api/health")" = 200
          test "$(curl --silent --show-error --max-time 30 --output ready.json --write-out '%{http_code}' --header "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/api/ready")" = 200
          node -e "
            const h=require('./health.json'),r=require('./ready.json');
            if(h.status!=='ok'||h.deployment?.environment!=='staging'||h.deployment?.revision!==process.env.EXPECTED_SHA)throw new Error('Health response is invalid.');
            if(r.ready!==true||!Array.isArray(r.reasons)||r.reasons.length!==0)throw new Error('Service is not ready.');"
      - name: Record deployment provenance
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          CLOUD_RUN_REVISION: ${{ steps.revision.outputs.name }}
        run: |
          mkdir -p deploy-provenance
          cp health.json ready.json deploy-provenance/
          node -e "require('node:fs').writeFileSync('deploy-provenance/gcp-staging.json',JSON.stringify({schemaVersion:1,environment:'staging',revision:process.env.EXPECTED_SHA,image:process.env.IMAGE_REF,cloudRunRevision:process.env.CLOUD_RUN_REVISION,service:process.env.GCP_CLOUD_RUN_SERVICE,region:process.env.GCP_REGION,inputInterpreter:process.env.INPUT_INTERPRETER,runId:process.env.GITHUB_RUN_ID},null,2)+'\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcp-staging-deployment-${{ inputs.expected_sha }}
          path: deploy-provenance
          if-no-files-found: error
          retention-days: 30
